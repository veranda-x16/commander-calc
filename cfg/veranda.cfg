# Veranda Calc: Commander Calc on Veranda (make veranda).
#
# The SDK's app-c-ovl.cfg, with Commander Calc's segments. Veranda gives an
# application $0801-$87FF, zero page $50-$7F and $A9-$FF, and RAM banks.
#
#   $0801 .. $82AF   MAIN   resident: ui + workbook + numbers + platform
#   $82B0 .. $85FF   FONT, LINE: below
#   $8600 .. $87FF   the C stack (512 bytes, as on the X16)
#   $A000 .. $BFFF   OVLn   each overlay at $A000 of a RAM bank of its own,
#                           run in place (app.hdr: overlays = banked; the
#                           loader's record n; platform/overlay_veranda.c)
#
# Zero page: cc65's ZEROPAGE and ZPBSS2 at $D4-$FF; ZPBSS at $50-$7F;
# $A9-$D3 stays the ROM maths library's (util/number_x16.s), which the
# start-up probe checks. GOLDENBSS (the X16's $0400 page) is ordinary BSS
# here: $0400-$07FF are Veranda's system variables.
#
# The overlay files ld65 writes (%O.n) are raw: tools/vpack.py makes the
# application file from them (record 0 the resident image).

#
# Below the C stack, two buffers of the screen's that are idle at times,
# each shared with the BSS of an SDK source compiled into an overlay
# (Veranda Look 2; the memory areas overlap on purpose):
#   $82B0 .. $85AF   FONT   screen_font, the grid's glyphs; while the Open
#                    and Save dialog is open (the SDK's vrchoose.c, overlay
#                    22) its BSS, VRFB; the font is copied from the ROM
#                    again after it (ui/filedlg.c)
#   $85B0 .. $85FF   LINE   scr_line, a run of text while it is drawn; while
#                    the title band is drawn (the SDK's vrwin.c, overlay
#                    21) its BSS, VRWB
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0200;
    __STACKSTART__: type = weak, value = $8800;     # its top
    __OVLSTART__:   type = weak, value = $8800;     # stackfloor_x16.s: the stack's top
    __SWAPSIZE__:   type = weak, value = $0350;     # FONT and LINE
}

MEMORY {
    ZP:   file = "", define = yes, start = $0050, size = $0030;
    ZP2:  file = "", define = yes, start = $00D4, size = $002C;
    MAIN: file = %O, define = yes, start = $0801, size = __STACKSTART__ - __STACKSIZE__ - __SWAPSIZE__ - $0801;
    FONT: file = "", define = yes, start = __STACKSTART__ - __STACKSIZE__ - __SWAPSIZE__, size = $0300;
    LINE: file = "", define = yes, start = __STACKSTART__ - __STACKSIZE__ - $0050, size = $0050;
    VRFB: file = "", define = yes, start = __STACKSTART__ - __STACKSIZE__ - __SWAPSIZE__, size = $0300;
    VRWB: file = "", define = yes, start = __STACKSTART__ - __STACKSIZE__ - $0050, size = $0050;
    OVL1: file = "%O.1", define = yes, start = $A000, size = $2000;
    OVL2: file = "%O.2", define = yes, start = $A000, size = $2000;
    OVL3: file = "%O.3", define = yes, start = $A000, size = $2000;
    OVL4: file = "%O.4", define = yes, start = $A000, size = $2000;
    OVL5: file = "%O.5", define = yes, start = $A000, size = $2000;
    OVL6: file = "%O.6", define = yes, start = $A000, size = $2000;
    OVL7: file = "%O.7", define = yes, start = $A000, size = $2000;
    OVL8: file = "%O.8", define = yes, start = $A000, size = $2000;
    OVL9: file = "%O.9", define = yes, start = $A000, size = $2000;
    OVL10: file = "%O.10", define = yes, start = $A000, size = $2000;
    OVL11: file = "%O.11", define = yes, start = $A000, size = $2000;
    OVL12: file = "%O.12", define = yes, start = $A000, size = $2000;
    OVL13: file = "%O.13", define = yes, start = $A000, size = $2000;
    OVL14: file = "%O.14", define = yes, start = $A000, size = $2000;
    OVL15: file = "%O.15", define = yes, start = $A000, size = $2000;
    OVL16: file = "%O.16", define = yes, start = $A000, size = $2000;
    OVL17: file = "%O.17", define = yes, start = $A000, size = $2000;
    OVL18: file = "%O.18", define = yes, start = $A000, size = $2000;
    OVL19: file = "%O.19", define = yes, start = $A000, size = $2000;
    OVL20: file = "%O.20", define = yes, start = $A000, size = $2000;   # the test builds' player
    OVL21: file = "%O.21", define = yes, start = $A000, size = $2000;   # the clipboard (clip_veranda.c), Look 2's chrome
    OVL22: file = "%O.22", define = yes, start = $A000, size = $2000;   # the Open and Save dialog (the SDK's vrchoose.c)
}

SEGMENTS {
    ZEROPAGE:  load = ZP2,  type = zp;
    EXTZP:     load = ZP2,  type = zp, optional = yes;
    ZPBSS2:    load = ZP2,  type = zp, define = yes, optional = yes;
    ZPBSS:     load = ZP,   type = zp, define = yes, optional = yes;
    STARTUP:   load = MAIN, type = ro;
    LOWCODE:   load = MAIN, type = ro, optional = yes;
    ONCE:      load = MAIN, type = ro, optional = yes;
    CODE:      load = MAIN, type = ro;
    RODATA:    load = MAIN, type = ro;
    DATA:      load = MAIN, type = rw;
    INIT:      load = MAIN, type = rw, optional = yes;
    BSS:       load = MAIN, type = bss, define = yes;
    GOLDENBSS: load = MAIN, type = bss, define = yes, optional = yes;
    FONTBSS:   load = FONT, type = bss, define = yes;
    LINEBSS:   load = LINE, type = bss, define = yes;
    VRFBSS:    load = VRFB, type = bss, define = yes, optional = yes;
    VRWBSS:    load = VRWB, type = bss, define = yes, optional = yes;

    OVERLAY1: load = OVL1, type = ro,  define = yes, optional = yes;
